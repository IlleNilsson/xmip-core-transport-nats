[package]
name = "xmip-core-transport-nats"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-nats"
description = "NATS transport: one PUB is one Stream, the subject beside it; a Location subscribes or publishes through a server, or accepts clients directly. Core NATS, at-most-once. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). NATS is a text line and a length. Its declaration
# takes the capability's `timeout` (`transport::configured::timeout`).
transport = { workspace = true }
# Each protocol line read under its ceiling (`net::read`), and the ceiling a
# payload's announced length is held to (`net::MAX_BODY`).
net = { workspace = true, optional = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }
# The CONNECT a client answers INFO with is JSON, its name escaped as JSON
# escapes it.
serde_json = { version = "1", optional = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:net", "dep:serde_json"]
# The declaration alone, with the `name` setting `nats-jetstream` declares
# too.
declaration = []

# The module's timing program (doc/governance/rust-style.md section 5c): a
# plain cargo test leaves it out, and the landing runs it after every other
# test here, alone, one test at a time, so what it measures is Xmip's work.
[[test]]
name = "measured"
path = "tests/measured/main.rs"
test = false

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
